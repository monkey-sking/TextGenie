name: Build and publish PopClip Extension

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0 (leave empty to build only)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject build version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          ref = os.environ.get("GITHUB_REF", "")
          supplied = os.environ.get("RELEASE_VERSION", "").strip()
          if ref.startswith("refs/tags/v"):
              version = ref.removeprefix("refs/tags/v")
          elif supplied:
              version = supplied.removeprefix("v")
          else:
              version = "0.0.0-dev+" + os.environ["GITHUB_SHA"][:7]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid release version: {version}")
          path = Path("src/TextGenie.popclipext/check-updates.js")
          source = path.read_text()
          if "__TEXTGENIE_VERSION__" not in source:
              raise SystemExit("Version placeholder missing from update checker")
          path.write_text(source.replace("__TEXTGENIE_VERSION__", version))
          print(f"Building TextGenie version {version}")
          PY

      - name: Validate extension manifest
        run: |
          python3 -m json.tool src/TextGenie.popclipext/Config.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("src/TextGenie.popclipext")
          config = json.loads((root / "Config.json").read_text())
          missing = []
          for action in config.get("actions", []):
              for key in ("javascript file", "applescript file"):
                  value = action.get(key)
                  if value and not (root / value).is_file():
                      missing.append(f"{key}: {value}")
              icon = action.get("icon")
              if icon and not (root / icon).is_file():
                  missing.append(f"icon: {icon}")
          if missing:
              raise SystemExit("Missing extension resources:\n" + "\n".join(missing))
          print(f"Validated {len(config.get('actions', []))} actions")
          PY

      - name: Check JavaScript syntax
        run: |
          for file in src/TextGenie.popclipext/*.js; do
            node - "$file" <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const file = process.argv[2];
          const source = fs.readFileSync(file, 'utf8');
          // PopClip evaluates action scripts in an async context; parse in the same context
          // so top-level await/return supported by PopClip are not false positives in Node CJS.
          new vm.Script('(async function popclipAction() {\n' + source + '\n})', { filename: file });
          NODE
          done


      - name: Run currency regression tests
        run: node tests/currency.test.js

      - name: Build extension archive
        run: |
          cd src
          zip -qr ../TextGenie.popclipextz TextGenie.popclipext/
          unzip -t ../TextGenie.popclipextz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextGenie-popclipextz
          path: TextGenie.popclipextz
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TextGenie.popclipextz
          generate_release_notes: true

      - name: Create release from manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v*) TAG="$VERSION" ;;
            *) TAG="v$VERSION" ;;
          esac
          gh release create "$TAG" TextGenie.popclipextz \
            --title "TextGenie $TAG" \
            --generate-notes
